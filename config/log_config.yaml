version: 1
disable_existing_loggers: False

formatters:
  simple:
    format: "%(message)s"  # Journal handles timestamps and metadata

handlers:
  journal:
    class: systemd.journal.JournalHandler
    level: INFO
    formatter: simple

  file:
    class: logging.FileHandler
    level: INFO
    formatter: simple
    filename: logs/mrpir.log
    encoding: utf8

loggers:
  mrpir:
    level: INFO
    handlers: [journal, file]
    propagate: no

root:
  level: DEBUG
  handlers: [journal, file]
