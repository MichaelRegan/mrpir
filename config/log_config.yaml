version: 1
formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

handlers:
  file_handler:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: simple
    filename: 'mrpir.log'
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: 'utf8'

  journal_handler:
    class: systemd.journal.JournalHandler
    level: INFO
    formatter: simple

loggers:
  __main__:
    level: DEBUG
    handlers: [file_handler, journal_handler]
    propagate: no

root:
  level: DEBUG
  handlers: [file_handler, journal_handler]
