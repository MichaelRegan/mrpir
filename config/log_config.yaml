version: 1
disable_existing_loggers: False

formatters:
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  json:
    format: '{"timestamp": "%(asctime)s", "logger": "%(name)s", "level": "%(levelname)s", "message": "%(message)s"}'

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: detailed
    stream: ext://sys.stdout

  file_handler:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: ~/.mrpir/logs/mrpir.log  # This will be dynamically updated in logger.py
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  error_file_handler:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: ~/.mrpir/logs/mrpir_error.log  # This will be dynamically updated in logger.py
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  journal:
    class: systemd.journal.JournalHandler
    level: INFO
    formatter: detailed

loggers:
  mrpir:
    level: DEBUG
    handlers: [console, file_handler, error_file_handler, journal]
    propagate: True

root:
  level: DEBUG
  handlers: [console, file_handler, error_file_handler, journal]
